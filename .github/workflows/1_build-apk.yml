name: Build Thunder AGI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python + Pillow for icon resize
        run: pip install Pillow

      - name: Download custom icon and generate all mipmap sizes
        run: |
          # The icon is committed to the repo at assets/app_icon_source.jpg
          # If not present, skip (keeps existing icons)
          if [ -f "lfm25/app/src/main/assets/app_icon_source.jpg" ]; then
            python3 << 'PYEOF'
          from PIL import Image
          import os
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          img = Image.open("lfm25/app/src/main/assets/app_icon_source.jpg").convert("RGBA")
          for name, size in sizes.items():
              d = f"lfm25/app/src/main/res/mipmap-{name}"
              os.makedirs(d, exist_ok=True)
              r = img.resize((size,size), Image.LANCZOS)
              r.save(f"{d}/ic_launcher.webp","WEBP")
              r.save(f"{d}/ic_launcher_round.webp","WEBP")
              print(f"✓ {name} {size}x{size}")
          PYEOF
          fi

      - name: Download model into assets
        run: |
          mkdir -p lfm25/app/src/main/assets
          wget -q --show-progress \
            "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_K_M.gguf" \
            -O lfm25/app/src/main/assets/model.gguf
          ls -lh lfm25/app/src/main/assets/

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      - name: Build APK
        working-directory: lfm25
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Rename APK
        run: |
          mkdir -p output
          cp lfm25/app/build/outputs/apk/debug/app-debug.apk \
             "output/ThunderAGI-الرعد-v2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-v2
          path: output/ThunderAGI-الرعد-v2.apk
          retention-days: 30
