name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Build APK
        working-directory: lfm25
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
      - uses: actions/upload-artifact@v4
        with:
          name: PocketLFM-LFM2.5-VL-450M
          path: lfm25/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
