name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          echo "Found sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      - name: Build Debug APK
        working-directory: lfm25
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLFM-LFM2.5-VL-450M
          path: lfm25/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
